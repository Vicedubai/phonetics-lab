<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phonetics Lab (Safe Mode)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown Parser (Marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');
        
        body { font-family: 'Noto Sans', sans-serif; background-color: #f3f4f6; }
        .ipa-text { font-family: 'Noto Serif', serif; }
        
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 20px; height: 20px; border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
            display: inline-block; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .markdown-body p { margin-bottom: 0.75em; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
        .markdown-body strong { font-weight: 600; color: #312e81; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; color: #1e1b4b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- AN TOÀN TUYỆT ĐỐI: KHÔNG CÓ API KEY TRONG CODE ---
        // Người dùng sẽ tự nhập key của họ vào Settings.
        
        // --- 1. API CALL FUNCTION ---
        async function callGemini(prompt, onStatusUpdate, maxTokens = 800) {
            const localKey = localStorage.getItem('user_gemini_key');
            
            // Nếu không có key, báo lỗi ngay
            if (!localKey) return "ERROR_MISSING_KEY";

            const delays = [500, 1500, 3000]; 
            let attempt = 0;
            
            while (attempt <= delays.length) {
                try {
                    if (onStatusUpdate) {
                        if (attempt === 0) onStatusUpdate("Connecting..."); 
                        else onStatusUpdate(`Retrying (${attempt})...`);
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${localKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                temperature: 0.2, 
                                maxOutputTokens: maxTokens, 
                            },
                            safetySettings: [
                                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                            ]
                        })
                    });

                    if (!response.ok) {
                        if (response.status === 429 || response.status === 503) {
                            console.warn(`Attempt ${attempt} failed. Retrying...`);
                            throw new Error("Server Busy"); 
                        }
                        if (response.status === 400) return "Error (400): Invalid API Key.";
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No text generated.";

                } catch (err) {
                    if (attempt === delays.length) {
                        console.error("Final failure:", err);
                        return `Failed: ${err.message}. Check connection.`;
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                    attempt++;
                }
            }
        }

        // --- COMPONENTS ---

        const MarkdownRenderer = ({ content }) => {
            const rawMarkup = marked.parse(content);
            return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: rawMarkup }} />;
        };

        const SettingsModal = ({ isOpen, onClose, isForceOpen }) => {
            const [localKey, setLocalKey] = useState(localStorage.getItem('user_gemini_key') || '');
            const [saved, setSaved] = useState(false);

            if (!isOpen) return null;

            const handleSave = () => {
                const cleanKey = localKey.trim();
                if (!cleanKey) {
                    alert("Please enter a valid API Key.");
                    return;
                }
                localStorage.setItem('user_gemini_key', cleanKey);
                setLocalKey(cleanKey);
                setSaved(true);
                setTimeout(() => { 
                    setSaved(false); 
                    onClose(); 
                }, 1000);
            };

            const handleClear = () => {
                localStorage.removeItem('user_gemini_key');
                setLocalKey('');
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md animate-fade-in border border-gray-200">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 className="text-xl font-bold text-gray-800">
                                {isForceOpen ? "Setup Required" : "API Settings"}
                            </h3>
                            {!isForceOpen && (
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                    <i className="fas fa-times"></i>
                                </button>
                            )}
                        </div>
                        
                        <div className="mb-4">
                            {isForceOpen && (
                                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-4 text-sm text-yellow-800">
                                    <p className="font-bold">Welcome!</p>
                                    <p>To use this app, you need your own Google Gemini API Key.</p>
                                </div>
                            )}

                            <label className="block text-sm font-semibold text-gray-700 mb-2">Google Gemini API Key</label>
                            <input 
                                type="password" 
                                className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none" 
                                placeholder="Paste your AIza... key here" 
                                value={localKey} 
                                onChange={(e) => setLocalKey(e.target.value)} 
                            />
                            
                            <p className="text-xs text-gray-500 mt-3">
                                <i className="fas fa-external-link-alt mr-1"></i> 
                                <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-indigo-600 underline hover:text-indigo-800">Get a free API Key here</a>
                            </p>
                            <p className="text-xs text-gray-400 mt-1">
                                <i className="fas fa-lock mr-1"></i> Your key is stored locally in your browser.
                            </p>
                        </div>

                        <div className="flex gap-2 justify-end">
                            {!isForceOpen && (
                                <button onClick={handleClear} className="px-4 py-2 text-red-600 hover:bg-red-50 rounded text-sm font-medium">Clear Key</button>
                            )}
                            <button onClick={handleSave} className={`px-6 py-2 rounded text-white font-bold transition-all ${saved ? 'bg-green-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {saved ? <span><i className="fas fa-check mr-1"></i> Saved!</span> : 'Save & Start'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AIResponseBox = ({ title, content, isLoading, loadingText, icon, color = "indigo" }) => {
            if (!isLoading && !content) return null;

            const bgClass = color === "green" ? "from-green-50 to-white border-green-100" : "from-indigo-50 to-white border-indigo-100";
            const textClass = color === "green" ? "text-green-800" : "text-indigo-800";
            const borderClass = color === "green" ? "border-green-100" : "border-indigo-100";
            const spinnerClass = color === "green" ? "border-green-600" : "border-indigo-600";

            return (
                <div className={`mt-6 bg-gradient-to-br ${bgClass} border rounded-xl p-6 shadow-sm animate-fade-in`}>
                    <div className={`flex items-center gap-3 mb-4 ${textClass} font-bold text-lg border-b ${borderClass} pb-2`}>
                        {isLoading ? <div className={`spinner ${spinnerClass}`}></div> : <i className={`fas ${icon} text-xl`}></i>}
                        <span>{title}</span>
                        {isLoading && <span className="text-sm font-normal opacity-70 ml-auto animate-pulse">{loadingText}</span>}
                    </div>
                    {isLoading ? (
                        <div className="space-y-3 animate-pulse opacity-50">
                            <div className={`h-4 bg-${color}-200 rounded w-3/4`}></div>
                            <div className={`h-4 bg-${color}-200 rounded w-1/2`}></div>
                        </div>
                    ) : (
                        <div className="text-gray-800 text-base leading-relaxed">
                            <MarkdownRenderer content={content} />
                        </div>
                    )}
                </div>
            );
        };

        const PhoneticsLab = ({ onRequireSettings }) => {
            const [text, setText] = useState("");
            const [transcription, setTranscription] = useState("");
            const [loadingTrans, setLoadingTrans] = useState(false);
            const [statusTrans, setStatusTrans] = useState("");
            const [analysis, setAnalysis] = useState("");
            const [loadingAnalysis, setLoadingAnalysis] = useState(false);
            const [statusAnalysis, setStatusAnalysis] = useState("");

            const checkKey = () => {
                const key = localStorage.getItem('user_gemini_key');
                if (!key) {
                    onRequireSettings();
                    return false;
                }
                return true;
            };

            const handleFastTranscribe = async () => {
                if (!checkKey()) return;
                if (!text.trim()) return;
                
                setLoadingTrans(true);
                setTranscription("");
                setAnalysis(""); 
                setLoadingAnalysis(false);
                
                const prompt = `Convert to IPA (RP, Peter Roach) for: "${text}".
                Output ONLY:
                1. **Broad**: /.../
                2. **Narrow**: [...] (with allophones)
                Do NOT explain.`;

                const data = await callGemini(prompt, (status) => setStatusTrans(status), 300);
                
                if (data === "ERROR_MISSING_KEY") {
                    onRequireSettings();
                    setLoadingTrans(false);
                    return;
                }

                setTranscription(data);
                setLoadingTrans(false);
            };

            const handleDeepAnalysis = async () => {
                if (!checkKey()) return;
                if (!text.trim()) return;

                setLoadingAnalysis(true);
                setAnalysis("");

                const prompt = `Analyze connected speech features (assimilation, elision, linking, glottal stops) for: "${text}".
                Based on Peter Roach's English Phonetics and Phonology.
                Keep it concise and clear.`;

                const data = await callGemini(prompt, (status) => setStatusAnalysis(status), 800);
                
                if (data === "ERROR_MISSING_KEY") {
                    onRequireSettings();
                    setLoadingAnalysis(false);
                    return;
                }

                setAnalysis(data);
                setLoadingAnalysis(false);
            };

            const handleClear = () => { setText(""); setTranscription(""); setAnalysis(""); };

            return (
                <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 w-full">
                    <div className="mb-6 relative">
                        <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Input English Text</label>
                        <textarea className="w-full p-4 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all text-lg resize-y min-h-[120px]" placeholder="Type English sentences here..." value={text} onChange={(e) => setText(e.target.value)}></textarea>
                        {text && <button onClick={handleClear} className="absolute top-10 right-4 text-gray-400 hover:text-gray-600" title="Clear"><i className="fas fa-times-circle"></i></button>}
                    </div>
                    
                    <div className="flex gap-4">
                        <button onClick={handleFastTranscribe} disabled={loadingTrans || !text.trim()} className="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all disabled:bg-gray-300 disabled:cursor-not-allowed shadow-lg shadow-indigo-200 text-lg">
                            {loadingTrans ? <span>Processing...</span> : <span><i className="fas fa-bolt mr-2 text-yellow-300"></i> Get IPA Instantly</span>}
                        </button>
                    </div>

                    <AIResponseBox 
                        title="IPA Transcription" 
                        content={transcription} 
                        isLoading={loadingTrans} 
                        loadingText={statusTrans} 
                        icon="fa-language" 
                    />

                    {!loadingTrans && transcription && !analysis && !loadingAnalysis && (
                        <div className="mt-6 flex justify-center animate-fade-in">
                            <button onClick={handleDeepAnalysis} className="bg-white border-2 border-green-500 text-green-600 font-bold py-2 px-6 rounded-full hover:bg-green-50 transition-all shadow-sm">
                                <i className="fas fa-microscope mr-2"></i> Detailed Explanation / Phonetic Analysis
                            </button>
                        </div>
                    )}

                    <AIResponseBox 
                        title="Phonetic & Connected Speech Analysis" 
                        content={analysis} 
                        isLoading={loadingAnalysis} 
                        loadingText={statusAnalysis} 
                        icon="fa-book-open"
                        color="green"
                    />

                    {!transcription && !loadingTrans && <div className="mt-8 text-center text-gray-400 text-sm"><i className="fas fa-info-circle mr-1"></i> Enter text above to start.</div>}
                </div>
            );
        };

        const App = () => {
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [forceSettings, setForceSettings] = useState(false);

            useEffect(() => {
                // Kiểm tra ngay khi tải trang, nếu chưa có key thì bắt buộc mở settings
                const key = localStorage.getItem('user_gemini_key');
                if (!key) {
                    setIsSettingsOpen(true);
                    setForceSettings(true);
                }
            }, []);

            const openSettings = () => {
                setIsSettingsOpen(true);
                setForceSettings(false); // Mở chủ động thì cho phép đóng
            };

            const closeSettings = () => {
                // Nếu đang ép buộc (chưa có key) thì không cho đóng trừ khi đã lưu
                const key = localStorage.getItem('user_gemini_key');
                if (forceSettings && !key) {
                    alert("Please enter an API Key to continue.");
                    return;
                }
                setIsSettingsOpen(false);
                setForceSettings(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 p-4 md:p-8 flex flex-col items-center">
                    <div className="w-full max-w-3xl flex justify-end mb-4">
                        <button onClick={openSettings} className="text-gray-500 hover:text-indigo-600 transition-colors flex items-center gap-2" title="Settings">
                            <span className="text-sm font-medium">API Key</span>
                            <i className="fas fa-cog text-xl"></i>
                        </button>
                    </div>
                    <header className="mb-8 text-center max-w-2xl">
                        <div className="inline-block p-3 rounded-full bg-indigo-100 text-indigo-600 mb-4 text-2xl"><i className="fas fa-headphones-simple"></i></div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight mb-2">Phonetics Lab</h1>
                        <p className="text-lg text-gray-600">Instant Transcription & Analysis Tool (Peter Roach)</p>
                    </header>
                    
                    <main className="w-full max-w-3xl">
                        <PhoneticsLab onRequireSettings={() => {
                            setForceSettings(true);
                            setIsSettingsOpen(true);
                        }} />
                    </main>
                    
                    <footer className="mt-12 text-gray-400 text-sm text-center">
                        <p>Powered by Gemini AI • Safe for GitHub Sharing</p>
                    </footer>
                    
                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={closeSettings} 
                        isForceOpen={forceSettings}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
