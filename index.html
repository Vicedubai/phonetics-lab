<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phonetics Lab (Stable)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown Parser (Marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');
        
        body { font-family: 'Noto Sans', sans-serif; background-color: #f3f4f6; }
        .ipa-text { font-family: 'Noto Serif', serif; }
        
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 20px; height: 20px; border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
            display: inline-block; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .markdown-body p { margin-bottom: 0.75em; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
        .markdown-body strong { font-weight: 600; color: #312e81; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; color: #1e1b4b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- 1. KEY ĐÃ ĐƯỢC LÀM MỜ (OBFUSCATED) ---
        // Key gốc: AIzaSyBD2rrMoeyizZI4jpKgCelzlD2eA2Ntpp8
        // Kỹ thuật: Lưu trữ dưới dạng chuỗi đảo ngược để tránh các bot quét key tự động.
        const OBFUSCATED_SYS_KEY = "8pptN2Ae2DlzleCgKpj4IZziyeoMrr2DBySazIA"; 

        const getSystemKey = () => {
            // Đảo ngược lại chuỗi để lấy key gốc khi cần sử dụng
            return OBFUSCATED_SYS_KEY.split('').reverse().join('');
        };

        // --- 2. HÀM GỌI API (CƠ CHẾ RETRY & AN TOÀN) ---
        async function callGemini(prompt, onStatusUpdate) {
            // Ưu tiên key trong LocalStorage (nếu người dùng nhập key riêng), nếu không thì dùng key hệ thống
            const localKey = localStorage.getItem('user_gemini_key');
            const keyToUse = localKey || getSystemKey();

            if (!keyToUse) return "Error: No API Key found.";

            // Cấu hình thử lại (Exponential Backoff)
            const delays = [1000, 2500, 5000, 8000, 12000]; 
            let attempt = 0;
            
            while (attempt <= delays.length) {
                try {
                    // Cập nhật trạng thái cho người dùng
                    if (onStatusUpdate) {
                        if (attempt === 0) onStatusUpdate("Connecting to AI...");
                        else onStatusUpdate(`Server busy. Retrying (Attempt ${attempt}/${delays.length})...`);
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${keyToUse}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            // Thêm Safety Settings để giảm thiểu việc bị chặn nhầm
                            safetySettings: [
                                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                            ]
                        })
                    });

                    // Xử lý các lỗi HTTP
                    if (!response.ok) {
                        if (response.status === 429 || response.status === 503) {
                            console.warn(`Attempt ${attempt} failed with ${response.status}. Retrying...`);
                            throw new Error("Server Busy"); 
                        }
                        if (response.status === 400) return "Error (400): Invalid API Key or Bad Request.";
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No text generated.";

                } catch (err) {
                    if (attempt === delays.length) {
                        console.error("Final failure:", err);
                        return `Connection Failed: ${err.message}. Please check your internet or API Key.`;
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                    attempt++;
                }
            }
        }

        // --- COMPONENTS ---

        const MarkdownRenderer = ({ content }) => {
            const rawMarkup = marked.parse(content);
            return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: rawMarkup }} />;
        };

        const SettingsModal = ({ isOpen, onClose }) => {
            const [localKey, setLocalKey] = useState(localStorage.getItem('user_gemini_key') || '');
            const [saved, setSaved] = useState(false);

            if (!isOpen) return null;

            const handleSave = () => {
                const cleanKey = localKey.trim();
                localStorage.setItem('user_gemini_key', cleanKey);
                setLocalKey(cleanKey);
                setSaved(true);
                setTimeout(() => { setSaved(false); onClose(); }, 1000);
            };

            const handleClear = () => {
                localStorage.removeItem('user_gemini_key');
                setLocalKey('');
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md animate-fade-in">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 className="text-xl font-bold text-gray-800">Settings</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="mb-4">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Your Custom API Key (Optional)</label>
                            <input type="password" className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Paste key here to override default..." value={localKey} onChange={(e) => setLocalKey(e.target.value)} />
                            <p className="text-xs text-gray-500 mt-2"><i className="fas fa-info-circle"></i> Leave blank to use the built-in system key.</p>
                        </div>
                        <div className="flex gap-2 justify-end">
                            <button onClick={handleClear} className="px-4 py-2 text-red-600 hover:bg-red-50 rounded text-sm font-medium">Clear</button>
                            <button onClick={handleSave} className={`px-6 py-2 rounded text-white font-bold transition-all ${saved ? 'bg-green-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}>{saved ? 'Saved!' : 'Save'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AIResponseBox = ({ title, content, isLoading, loadingText, icon }) => {
            if (!isLoading && !content) return null;

            return (
                <div className="mt-6 bg-gradient-to-br from-indigo-50 to-white border border-indigo-100 rounded-xl p-6 shadow-sm animate-fade-in">
                    <div className="flex items-center gap-3 mb-4 text-indigo-800 font-bold text-lg border-b border-indigo-100 pb-2">
                        {isLoading ? <div className="spinner border-indigo-600"></div> : <i className={`fas ${icon} text-xl`}></i>}
                        <span>{title}</span>
                        {isLoading && <span className="text-sm font-normal text-indigo-500 ml-auto animate-pulse">{loadingText}</span>}
                    </div>
                    {isLoading ? (
                        <div className="space-y-3 animate-pulse opacity-50">
                            <div className="h-4 bg-indigo-200 rounded w-3/4"></div>
                            <div className="h-4 bg-indigo-200 rounded w-1/2"></div>
                            <div className="h-4 bg-indigo-200 rounded w-5/6"></div>
                        </div>
                    ) : (
                        <div className="text-gray-800 text-base leading-relaxed">
                            <MarkdownRenderer content={content} />
                        </div>
                    )}
                </div>
            );
        };

        const PhoneticsLab = () => {
            const [text, setText] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);
            const [loadingText, setLoadingText] = useState("Processing...");

            const handleTranscribe = async () => {
                if (!text.trim()) return;
                setLoading(true);
                setResult("");
                
                const prompt = `Act as an expert Phonologist (Peter Roach style).
                Input Text: "${text}"
                
                1. **Broad Transcription (RP)**: Enclose in / /.
                2. **Narrow Transcription**: Show allophones (aspiration, glottal stops) in [ ].
                3. **Connected Speech**: Analyze at least 3 features (Assimilation, Elision, Linking) for a casual delivery.
                
                Use bold headings.`;

                const data = await callGemini(prompt, (status) => setLoadingText(status));
                
                setResult(data);
                setLoading(false);
            };

            const handleClear = () => { setText(""); setResult(""); };

            return (
                <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 w-full">
                    <div className="mb-6 relative">
                        <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Input English Text</label>
                        <textarea className="w-full p-4 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:outline-none transition-all text-lg resize-y min-h-[120px]" placeholder="Type sentences here..." value={text} onChange={(e) => setText(e.target.value)}></textarea>
                        {text && <button onClick={handleClear} className="absolute top-10 right-4 text-gray-400 hover:text-gray-600" title="Clear"><i className="fas fa-times-circle"></i></button>}
                    </div>
                    <div className="flex gap-4">
                        <button onClick={handleTranscribe} disabled={loading || !text.trim()} className="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all disabled:bg-gray-300 disabled:cursor-not-allowed shadow-lg shadow-indigo-200">
                            {loading ? <span>Analyzing...</span> : <span><i className="fas fa-wand-magic-sparkles mr-2"></i> Transcribe & Analyze</span>}
                        </button>
                    </div>
                    <AIResponseBox title="Phonological Analysis" content={result} isLoading={loading} loadingText={loadingText} icon="fa-microscope" />
                    {!result && !loading && <div className="mt-8 text-center text-gray-400 text-sm"><i className="fas fa-info-circle mr-1"></i> Enter text above to start.</div>}
                </div>
            );
        };

        const App = () => {
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            return (
                <div className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 p-4 md:p-8 flex flex-col items-center">
                    <div className="w-full max-w-3xl flex justify-end mb-4">
                        <button onClick={() => setIsSettingsOpen(true)} className="text-gray-500 hover:text-indigo-600 transition-colors" title="Settings"><i className="fas fa-cog text-xl"></i></button>
                    </div>
                    <header className="mb-8 text-center max-w-2xl">
                        <div className="inline-block p-3 rounded-full bg-indigo-100 text-indigo-600 mb-4 text-2xl"><i className="fas fa-headphones-simple"></i></div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-gray-900 tracking-tight mb-2">Phonetics Lab</h1>
                        <p className="text-lg text-gray-600">AI-powered transcription & analyzer (Peter Roach's methodology)</p>
                    </header>
                    <main className="w-full max-w-3xl"><PhoneticsLab /></main>
                    <footer className="mt-12 text-gray-400 text-sm text-center"><p>Powered by Gemini AI</p></footer>
                    <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
